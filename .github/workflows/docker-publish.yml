# Build and publish the Docker image to GitHub Container Registry.
# Image: ghcr.io/adducec03/notion2tex
#
# One-time setup (repo owner):
# 1. Settings -> Actions -> General -> Workflow permissions -> allow
#    "Read and write permissions" (this workflow's own `permissions:`
#    block below should cover it, but some orgs enforce a repo-level cap).
# 2. After the first successful run, the package is created PRIVATE by
#    default: github.com/adducec03?tab=packages -> notion2tex -> Package
#    settings -> Danger Zone -> Change visibility -> Public. Until this is
#    done, external users pulling the image anonymously get a 403/denied
#    error, not a helpful message.

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Tagged releases must match notion2tex/__init__.py, or the Docker
      # image and the PyPI package (published separately by
      # pypi-publish.yml, which runs the same check) end up numbered
      # differently for what's supposed to be the same release.
      - name: Verify tag matches notion2tex/__init__.py version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import re,sys; text=open('notion2tex/__init__.py').read(); m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', text); sys.exit('no __version__ found') if not m else print(m.group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match notion2tex/__init__.py's __version__ ($PKG_VERSION). Bump __version__, commit, then re-tag."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
