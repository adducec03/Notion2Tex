# Build and publish the Docker image to GitHub Container Registry.
# Image: ghcr.io/adducec03/notion2tex
#
# One-time setup (repo owner):
# 1. Settings -> Actions -> General -> Workflow permissions -> allow
#    "Read and write permissions" (this workflow's own `permissions:`
#    block below should cover it, but some orgs enforce a repo-level cap).
# 2. After the first successful run, the package is created PRIVATE by
#    default: github.com/adducec03?tab=packages -> notion2tex -> Package
#    settings -> Danger Zone -> Change visibility -> Public. Until this is
#    done, external users pulling the image anonymously get a 403/denied
#    error, not a helpful message.

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
