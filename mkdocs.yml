site_name: Notion2Tex
site_description: Convert Notion HTML exports to PDF via a local LaTeX pipeline
site_url: https://adducec03.github.io/Notion2Tex/
repo_url: https://github.com/adducec03/Notion2Tex
repo_name: adducec03/Notion2Tex
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/home
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Pipeline: pipeline.md
  - Development: development.md
  - Troubleshooting: troubleshooting.md

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adducec03/Notion2Tex
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/notion2tex/
